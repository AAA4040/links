<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Afef - Professional Digital Identity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #060b13;
            --cyber-cyan: #00f3ff;
            --cyber-blue: #38bdf8;
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(56, 189, 248, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* بناء الخلفية بنمط تقني مستقبلي */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(6, 11, 19, 0.85), rgba(6, 11, 19, 0.95)),
                radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.15), transparent 60%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* شبكة برمجية خفيفة في الخلفية تتحرك ببطء */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(18, 24, 38, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 24, 38, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            from {
                background-position: 0 0;
            }

            to {
                background-position: 30px 60px;
            }
        }

        /* الحاوية الرئيسية مع تأثير الظهور الانسيابي */
        .profile-container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* تأثير إطار الشعار الفخم */
        .logo-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--cyber-cyan), transparent, var(--cyber-blue));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            animation: float 4s ease-in-out infinite;
        }

        .logo-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #0b1320;
            display: block;
        }

        /* التحركات الحركية المخصصة للشعار */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
                filter: blur(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .profile-title {
            font-size: 1.8rem;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff 30%, var(--cyber-blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        .profile-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        /* هندسة بطاقات الزجاج المستقبلي (Glassmorphism) */
        .link-card {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px 24px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        /* تأثير خط النيون الخلفي عند الـ Hover */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.15), transparent);
            transition: all 0.6s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-4px);
            border-color: var(--cyber-cyan);
            background: rgba(30, 41, 59, 0.7);
            box-shadow: 0 8px 20px rgba(0, 243, 255, 0.15), inset 0 0 8px rgba(0, 243, 255, 0.1);
        }

        .link-card i {
            font-size: 1.4rem;
            margin-right: 18px;
            width: 30px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .link-card:hover i {
            transform: scale(1.15);
        }

        /* تلوين النيون المتناسق مع الشعار للأيقونات */
        .fa-linkedin {
            color: #0a66c2;
            text-shadow: 0 0 10px rgba(10, 102, 194, 0.3);
        }

        .fa-github {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .fa-envelope {
            color: var(--cyber-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .link-card span {
            flex-grow: 1;
            text-align: left;
        }

        /* سهم تجميلي نيون على جهة اليمين يعطي طابع القوائم المتطورة */
        .link-card::after {
            content: '\2192';
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
            opacity: 0.5;
        }

        .link-card:hover::after {
            color: var(--cyber-cyan);
            transform: translateX(4px);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="profile-container">
        <div class="logo-wrapper">
            <img src="logo.png" alt="Azhar Afef Logo" class="logo-image">
        </div>

        <h1 class="profile-title">Azhar Afef</h1>
        <p class="profile-subtitle">Backend Developer</p>

        <div class="links-wrapper">
            <a href="https://linkedin.com/in/azhar-afef-728895399" target="_blank" class="link-card">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>

            <a href="https://aaa4040.github.io" target="_blank" class="link-card">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>

            <a href="mailto:azharalafef@gmail.com" class="link-card">
                <i class="fas fa-envelope"></i>
                <span>Email</span>
            </a>
        </div>
    </div>

</body>

</html>
