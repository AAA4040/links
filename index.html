<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azhar Afef - Professional Links</title>
    <!-- استيراد مكتبة الأيقونات الشهيرة Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --hover-color: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .profile-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .profile-title {
            font-size: 1.6rem;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .profile-subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            border: 1px solid #334155;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background-color: #131e31;
            border-color: var(--accent-color);
        }

        .link-card i {
            font-size: 1.3rem;
            margin-right: 15px;
            width: 25px;
            text-align: center;
        }

        /* تلوين أيقونات المواقع بألوانها الرسمية لمظهر احترافي */
        .fa-linkedin {
            color: #0a66c2;
        }

        .fa-github {
            color: #ffffff;
        }

        .fa-envelope {
            color: #ea4335;
        }

        .link-card span {
            flex-grow: 1;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="profile-container">
        <h1 class="profile-title">Azhar Afef</h1>
        <p class="profile-subtitle">Software Engineer / Student</p>

        <div class="links-wrapper">
            <!-- رابط LinkedIn: استبدل بالرابط الخاص بك -->
            <a href="https://linkedin.com/in/azhar-afef-728895399" target="_blank" class="link-card">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>

            <!-- رابط GitHub: استبدل بالرابط الخاص بك -->
            <a href="https://aaa4040.github.io" target="_blank" class="link-card">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>

            <!-- رابط البريد الإلكتروني: استبدل ببريدك الإلكتروني -->
            <a href="mailto:azharalafef@gmail.com" class="link-card">
                <i class="fas fa-envelope"></i>
                <span>Email</span>
            </a>
        </div>
    </div>

</body>

</html>
